services:
  - type: web
    name: servicio-incentivos
    runtime: docker
    dockerfilePath: ./servicio_incentivos/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incentivos-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: incentivos-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: incentivos-db
          property: password

databases:
  - name: incentivos-db
    plan: free
    databaseName: incentivos_db
    user: postgres
