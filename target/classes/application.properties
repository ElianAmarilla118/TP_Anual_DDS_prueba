spring.application.name=servicio-incentivos

# Configuración de Base de Datos H2 en memoria (imita tipos de datos MySQL)
spring.datasource.url=${DB_INCENTIVOS_URL:jdbc:h2:mem:incentivos_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_INCENTIVOS_USER:sa}
spring.datasource.password=${DB_INCENTIVOS_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Puerto dinámico: Render inyecta la variable PORT, localmente usa 8082
server.port=${PORT:8082}

# URL del servidor de automatización low-code n8n para la difusión de insignias
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/Insignias}

# Logs operativos básicos
logging.level.root=INFO
logging.level.ar.edu.utn.ba.dsi.g10.servicio_incentivos=DEBUG
