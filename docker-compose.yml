version: '3.8'

services:
  servicio-incentivos:
    build:
      context: ./servicio_incentivos
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://incentivos-db:5411/incentivos_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=root
    depends_on:
      - incentivos-db

  broker-integracion:
    build:
      context: ./broker
    ports:
      - "8080:8080"
    environment:
      - CONEXIONES_SERVICIO_INCENTIVOS=http://servicio-incentivos:8080
    depends_on:
      - servicio-incentivos

  incentivos-db:
    image: postgres:15-alpine
    ports:
      - "5411:5432"
    environment:
      POSTGRES_DB: incentivos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
