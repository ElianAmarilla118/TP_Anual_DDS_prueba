# servicio_incentivos/src/main/resources/application.yaml
spring:
  application:
    name: servicio_incentivos

  datasource:
    # 🟢 Concatenamos los flags de SSL requeridos por la infraestructura de Render
    url: jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}?ssl=true&sslmode=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Sincroniza las tablas físicas de DonaTrack de forma automática en Render
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}
