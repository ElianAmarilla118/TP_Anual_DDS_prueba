spring:
  application:
    name: servicio_incentivos

  datasource:
    
    url: jdbc:postgresql://dpg-dbi815ei0phs73d47br0-a.oregon-postgres.render.com:5432/incentivos_db_ipvk?sslmode=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

conexiones:
  cola-de-mensajes: ${COLA_DE_MENSAJES:http://localhost:8081}
    
keyclock:  
  spring:
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${conexiones.auth-url}/realms/donatrack
