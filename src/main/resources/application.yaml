spring:
  application:
    name: servicio_incentivos

  datasource:
    # 🟢 Reconstruye la URL de red privada interna usando el protocolo JDBC nativo de Java
    url: jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Sincroniza dinámicamente las entidades en el esquema relacional de Render
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}
