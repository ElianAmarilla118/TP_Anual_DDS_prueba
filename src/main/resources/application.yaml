spring:
  application:
    name: servicio_incentivos

  datasource:
    # 🟢 Forzamos el host estático interno agregando explícitamente el parámetro de conexión SSL
    url: jdbc:postgresql://dpg-dbvh6uc6qcc73f3htvg-a:5432/incentivos_db_ulcg?ssl=true&sslmode=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}
