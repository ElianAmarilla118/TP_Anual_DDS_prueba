spring.application.name=servicio-donaciones

# Configuración híbrida de Base de Datos (H2 en memoria emulando MySQL)
spring.datasource.url=${DB_DONACIONES_URL:jdbc:h2:mem:donaciones_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_DONACIONES_USER:sa}
spring.datasource.password=${DB_DONACIONES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Puerto dinámico: Render inyecta la variable PORT, localmente usa 8080
server.port=${PORT:8080}

# URLs de los microservicios del ecosistema (conectados a la red de Docker/Render)
services.incentivos.url=${INCENTIVOS_URL:http://localhost:8082/api}
services.mensajes.url=${NOTIFICACIONES_URL:http://localhost:8084}
# Entrega 4: Donaciones ya no le pega directo a logística, le pega a la ruta del Broker
services.broker-logistica.url=${BROKER_LOGISTICA_URL:http://localhost:8083/api/donacionesAsignadas}

# Cron para la ejecución asincrónica de algoritmos de matchmaking (baja carga)
horario-baja-carga.cron=0 0 3 * * *

# Logs operativos
logging.level.root=INFO
://level.com.grupo10.servicio_donaciones=DEBUG
