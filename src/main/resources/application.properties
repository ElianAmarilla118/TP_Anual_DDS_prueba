spring.application.name=Logistica

# Configuración de Base de Datos H2 en memoria
spring.datasource.url=${DB_URL:jdbc:h2:mem:logistica_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto dinámico asignado por Render (Local usa 8081)
server.port=${PORT:8081}

# URL para devolver los eventos de las rutas a Donaciones (CNotificaciones)
services.donaciones.url=${DONACIONES_URL:http://localhost:8080}

# Configuración de logs limpia para producción
logging.level.root=INFO
logging.level.org.springframework.boot=INFO
://level.com.Donatrack.Logistica=DEBUG