<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonaTrack - Misión Actual</title>
  <link rel="stylesheet" th:href="@{/css/donatrack.css}">
</head>
<body>
  <main class="container">
    <!-- Banner de error no intrusivo (Requerimiento Entrega 6) -->
    <div th:if="${error}" role="alert" class="toast-error" th:text="${error}"></div>

    <!-- Inserción del componente acoplable -->
    <div th:replace="~{fragments/incentivos-widgets :: widget-mision(${mision})}"></div>

    <!-- Navegación rápida entre vistas (Touch target >= 48px) -->
    <nav aria-label="Navegación de incentivos" class="nav-actions">
      <a th:href="@{/ui/incentivos/{id}/metricas(id=${donanteId})}" class="btn">Ver Métricas</a>
      <a th:href="@{/ui/incentivos/{id}/insignias(id=${donanteId})}" class="btn">Ver Insignias</a>
      <a th:href="@{/ui/incentivos/ranking-mensual}" class="btn">Ver Ranking</a>
    </nav>
  </main>
</body>
</html>
