<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonaTrack - Mis Insignias</title>
  <link rel="stylesheet" th:href="@{/css/donatrack.css}">
</head>
<body>
  <main class="container">
    <div th:if="${error}" role="alert" class="toast-error" th:text="${error}"></div>

    <!-- Fragmento acoplable -->
    <div th:replace="~{fragments/incentivos-widgets :: widget-insignias(${insignias})}"></div>

    <nav aria-label="Navegación de incentivos" class="nav-actions">
      <a th:href="@{/ui/incentivos/{id}/metricas(id=${donanteId})}" class="btn">Ver Métricas</a>
      <a th:href="@{/ui/incentivos/{id}/misiones(id=${donanteId})}" class="btn">Ver Misión Actual</a>
      <a th:href="@{/ui/incentivos/ranking-mensual}" class="btn">Ver Ranking</a>
    </nav>
  </main>
</body>
</html>
